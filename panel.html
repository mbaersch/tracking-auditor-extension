<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* Palette ported 1:1 from the EC-Validator. Dark mode follows
       prefers-color-scheme, which inside a DevTools panel tracks the DevTools
       theme — so no theme toggle / storage is needed. */
    :root {
      --primary: #C44E00;
      --secondary: #005141;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --surface-warm: #fff7ed;
      --surface-warm-hover: #fef0e0;
      --surface-cool: #eff6ff;
      --surface-teal: #ecfdf6;
      --surface-hover-primary: #fef9f4;
      /* Per-provider card tints — each a faint nod to the brand colour, kept
         distinct from one another so a mixed stream scans at a glance. */
      --card-pinterest: #fef2f2;   /* red    */
      --card-tiktok:    #fdf4ff;   /* fuchsia */
      --card-googleads: #ffe6cc;   /* peach — a second Google warm, well clear of Meta's blue */
      --card-linkedin:  #e7f3fb;   /* azure (a touch cyaner than Meta's sky) */
      --card-reddit:    #ffe8de;   /* orangered — redder than GA4's warm / Ads' peach */
      --card-snapchat:  #fef8d9;   /* yellow — distinct from every other tint */
      --text: #1e293b;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --text-fainter: #cbd5e1;
      --text-strong: #475569;
      --border: #e2e8f0;
      --code-bg: #f1f5f9;
      --danger-text: #991b1b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        /* Lift the teal so IDs/method (.ev-tid, .ev-method) stay legible on the
           dark surface — the print-dark #005141 all but vanishes there. */
        --secondary: #2dd4bf;
        --bg: #0f1115;
        --surface: #1c1f26;
        --surface-alt: #262a33;
        --surface-warm: #2a2218;
        --surface-warm-hover: #332918;
        --surface-cool: #1a2230;
        --surface-teal: #16282a;
        --surface-hover-primary: #2a2018;
        --card-pinterest: #2a1719;   /* red    */
        --card-tiktok:    #271a2b;   /* fuchsia */
        --card-googleads: #3a2a14;   /* peach  */
        --card-linkedin:  #10222f;   /* azure  */
      --card-reddit:    #34190f;   /* orangered */
      --card-snapchat:  #33300d;   /* yellow */
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --text-faint: #64748b;
        --text-fainter: #475569;
        --text-strong: #cbd5e1;
        --border: #2f3540;
        --code-bg: #262a33;
        --danger-text: #f87171;
      }
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 12px; }

    /* Sticky header: toolbar + collapsible record settings + filter bar */
    .head { position: sticky; top: 0; z-index: 50; background: var(--surface); border-bottom: 1px solid var(--border); }
    .toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; }
    .toolbar button { font-size: 12px; padding: 5px 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 6px; cursor: pointer; font-weight: 600; font-family: inherit; }
    .toolbar button:hover { border-color: var(--primary); color: var(--primary); }
    .toolbar button.recording { background: #dc2626; color: #fff; border-color: #dc2626; }
    .toolbar button.recording:hover { filter: brightness(1.05); color: #fff; }
    .toolbar button.icon-btn { padding: 5px 9px; display: inline-flex; align-items: center; justify-content: center; }
    .toolbar button.icon-btn svg { display: block; }
    .toolbar button.icon-btn.active { border-color: var(--primary); color: var(--primary); background: var(--surface-hover-primary); }
    .rec-status { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); margin-left: auto; }

    /* Record settings ("in") and filter bar ("out") — independent control rows */
    .ctl-row { display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-top: 1px solid var(--border); font-size: 11px; flex-wrap: wrap; }
    .ctl-row[hidden] { display: none; }
    .ctl-label { font-weight: 700; color: var(--text-strong); text-transform: uppercase; letter-spacing: 0.4px; font-size: 10px; }
    .ctl-row label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; color: var(--text); }
    .ctl-row input[type="checkbox"] { accent-color: var(--secondary); cursor: pointer; margin: 0; }
    .ctl-hint { color: var(--text-faint); font-style: italic; }
    /* Bulk toggle links for the Show row — dezent, keep out of the tab-order weight */
    .ctl-links { display: inline-flex; gap: 4px; align-items: center; color: var(--text-fainter); }
    .ctl-links a { color: var(--text-muted); cursor: pointer; text-decoration: none; border-bottom: 1px dotted var(--text-fainter); }
    .ctl-links a:hover { color: var(--primary); border-bottom-color: var(--primary); }
    /* "follow" (auto-scroll) toggle sits apart from the provider filter pills */
    .ctl-follow { color: var(--text-muted); white-space: nowrap; padding-left: 6px; border-left: 1px solid var(--border); }
    /* Filter pills ("out" side): compact toggles built only for enabled/seen
       services, so the bar carries no chip for a service you never record. */
    #fltPills { display: inline-flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .flt-pill { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text-muted); cursor: pointer; user-select: none; }
    .flt-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .flt-pill:hover { border-color: var(--primary); }
    .flt-group[hidden] { display: none; }
    .settings { background: var(--surface-alt); }
    #filterText { flex: 1; min-width: 100px; font-size: 11px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-family: inherit; }
    #filterText:focus { outline: none; border-color: var(--primary); }
    .rec-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--text-fainter); }
    .rec-dot.live { background: #dc2626; animation: rec-pulse 1.5s infinite; }
    @keyframes rec-pulse { 0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.5); } 70% { box-shadow: 0 0 0 6px rgba(220,38,38,0); } 100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); } }

    /* Empty state */
    .empty { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 12px; font-style: italic; }

    /* Navigation blocks */
    #blocks { padding: 8px 12px 24px; }
    .blk { margin-bottom: 16px; }
    .blk-head { font-family: 'Fira Code', 'Consolas', monospace; font-size: 11px; color: var(--text-strong); padding: 6px 8px; background: var(--surface-alt); border-radius: 6px; border-left: 3px solid var(--secondary); word-break: break-all; }
    .blk-head .blk-time { color: var(--text-faint); margin-right: 8px; }
    .blk-events { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }

    /* Event cards — tinted per provider so a mixed stream scans easily: GA4 amber,
       Google Ads peach (a second Google warm), Meta blue, Bing teal, TikTok fuchsia,
       Pinterest red, LinkedIn azure; masked GA4 transports run a touch warmer. */
    .ev { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
    .ev.p-ga4    { background: var(--surface-warm); }
    .ev.p-meta   { background: var(--surface-cool); }
    .ev.p-uet    { background: var(--surface-teal); }
    .ev.p-tiktok { background: var(--card-tiktok); }
    .ev.p-pinterest { background: var(--card-pinterest); }
    .ev.p-googleads { background: var(--card-googleads); }
    .ev.p-linkedin { background: var(--card-linkedin); }
    .ev.p-reddit { background: var(--card-reddit); }
    .ev.p-snapchat { background: var(--card-snapchat); }
    .ev.t-stape-b64, .ev.t-custom-path { background: var(--surface-warm-hover); }
    .ev-head { display: flex; gap: 6px; align-items: baseline; font-family: 'Fira Code', 'Consolas', monospace; font-size: 10px; color: var(--text-muted); flex-wrap: wrap; }
    .ev-time { color: var(--text); }
    .ev-method { font-weight: 700; color: var(--secondary); font-size: 9px; }
    .ev-tid { color: var(--secondary); font-weight: 700; }
    .ev-caret { margin-left: auto; color: var(--text-muted); font-size: 14px; line-height: 1; user-select: none; padding: 0 2px; }
    .ev:hover .ev-caret { color: var(--primary); }
    .ev-name { font-weight: 700; font-size: 13px; color: var(--text); text-transform: none; margin: 4px 0 2px; }
    .ev-dl { font-family: 'Fira Code', 'Consolas', monospace; font-size: 10px; color: var(--text-muted); word-break: break-all; line-height: 1.3; margin: 2px 0; }
    .ev-pills { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
    .ev-summary { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }

    /* Pills */
    .pill { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; padding: 2px 6px; border-radius: 10px; white-space: nowrap; cursor: help; }
    .pill-standard { background: #d1fae5; color: #065f46; }
    .pill-stape    { background: #cffafe; color: #155e75; }
    .pill-custom   { background: #e0e7ff; color: #3730a3; }
    .pill-ga4      { background: #e37400; color: #fff; }
    .pill-meta     { background: #1877f2; color: #fff; }
    .pill-bing     { background: #0a8a8a; color: #fff; }
    .pill-tiktok   { background: #010101; color: #25f4ee; }
    .pill-pinterest { background: #e60023; color: #fff; }
    .pill-googleads { background: #b45309; color: #fff; }
    .pill-linkedin  { background: #0a66c2; color: #fff; }
    .pill-reddit    { background: #ff4500; color: #fff; }
    .pill-snapchat  { background: #fffc00; color: #111; }
    .pill-consent-info { background: #ede9fe; color: #5b21b6; }
    .pill-em       { background: #dbeafe; color: #1e40af; }
    .pill-ud       { background: #e2e8f0; color: #475569; }
    .pill-event    { background: #ede9fe; color: #5b21b6; }
    .pill-ep       { background: #f1f5f9; color: #64748b; }
    .pill-conversion { background: #16a34a; color: #fff; }
    .pill-ee       { background: #fae8ff; color: #86198f; }
    .pill-consent-granted { background: #d1fae5; color: #065f46; }
    .pill-consent-denied  { background: #fee2e2; color: #991b1b; }
    .pill-consent-unset   { background: #ffedd5; color: #9a3412; }

    /* Inline detail */
    .ev-detail { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
    .ev-detail[hidden] { display: none; }
    .det-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .det-table td { padding: 4px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .det-table td:first-child { white-space: nowrap; color: var(--text-strong); font-weight: 600; width: 1px; padding-right: 12px; }
    .det-table td:nth-child(2) { word-break: break-all; font-family: 'Fira Code', 'Consolas', monospace; }
    .det-section { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-faint); font-weight: 700; margin: 8px 0 2px; }
    .det-dump { font-size: 10px; font-family: 'Fira Code', 'Consolas', monospace; white-space: pre-wrap; word-break: break-word; overflow-x: auto; max-width: 100%; margin: 2px 0 0; padding: 6px; background: rgba(127,127,127,0.08); border-radius: 4px; }
    .det-note { font-size: 11px; line-height: 1.5; color: var(--text); margin: 2px 0 0; padding: 6px 8px; background: rgba(127,127,127,0.08); border-radius: 4px; }
    .det-note a { color: var(--primary); }
    code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; color: var(--primary); }
  </style>
</head>
<body>
  <header class="head">
    <div class="toolbar">
      <button id="recordBtn">Record</button>
      <button id="clearBtn">Clear</button>
      <button id="settingsBtn" class="icon-btn" title="Capture settings — which services are recorded">⚙</button>
      <button id="exportBtn" class="icon-btn" title="Export the currently visible events to a JSON file">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v7"/><path d="M5 6.5 8 9.5l3-3"/><path d="M3 13h10"/></svg>
      </button>
      <button id="importBtn" class="icon-btn" title="Open a previously exported JSON capture">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9.5v-7"/><path d="M5 5.5 8 2.5l3 3"/><path d="M3 13h10"/></svg>
      </button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <span class="rec-status"><span class="rec-dot" id="recDot"></span><span id="recCount">0 events / 0 pages</span></span>
    </div>
    <div id="settings" class="ctl-row settings" hidden>
      <span class="ctl-label">Record</span>
      <label><input type="checkbox" data-rec="ga4" checked> GA4</label>
      <label><input type="checkbox" data-rec="googleads" checked> Google Ads</label>
      <label><input type="checkbox" data-rec="meta" checked> Meta</label>
      <label><input type="checkbox" data-rec="uet" checked> Bing</label>
      <label><input type="checkbox" data-rec="tiktok" checked> TikTok</label>
      <label><input type="checkbox" data-rec="pinterest" checked> Pinterest</label>
      <label><input type="checkbox" data-rec="linkedin" checked> LinkedIn</label>
      <label><input type="checkbox" data-rec="reddit" checked> Reddit</label>
      <label><input type="checkbox" data-rec="snapchat" checked> Snapchat</label>
      <span class="ctl-hint">which services are captured (applies to new hits)</span>
    </div>
    <div class="ctl-row filterbar">
      <span id="fltGroup" class="flt-group">
        <span class="ctl-label">Show</span>
        <span class="ctl-links"><a id="fltAll" role="button" tabindex="0">all</a> · <a id="fltNone" role="button" tabindex="0">none</a></span>
        <span id="fltPills"></span>
      </span>
      <label class="ctl-follow" title="Keep the newest events in view while recording"><input type="checkbox" id="autoScroll" checked> ⤓ follow</label>
      <input type="search" id="filterText" placeholder="filter by event, id (AW-…), label, parameter…" autocomplete="off">
    </div>
  </header>
  <div id="empty" class="empty">Hit <b>Start &amp; Reload</b> — GA4, Google Ads, Meta, Bing, TikTok, Pinterest, LinkedIn, Reddit and Snapchat requests will appear here, grouped per page load.</div>
  <div id="blocks"></div>

  <script type="module" src="panel.js"></script>
</body>
</html>
