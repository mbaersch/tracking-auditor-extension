<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Brand-green rounded square (icon family with the EC-Validator) -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#005141"/>
  <!-- Analytics bars inside the lens (white) -->
  <g fill="#ffffff">
    <rect x="37" y="50" width="8" height="20" rx="2"/>
    <rect x="48" y="42" width="8" height="28" rx="2"/>
    <rect x="59" y="34" width="8" height="36" rx="2"/>
  </g>
  <!-- Magnifier in brand-orange -->
  <circle cx="52" cy="52" r="34" fill="none" stroke="#C44E00" stroke-width="10"/>
  <line x1="78" y1="78" x2="100" y2="100" stroke="#C44E00" stroke-width="13" stroke-linecap="round"/>
</svg>
